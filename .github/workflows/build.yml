name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q '*.zip'
      - run: sed -i 's/private val listener = Listener(/private val listener: Listener = Listener(/' JarvisAssistant/app/src/main/java/com/example/jarvis/ui/ChatViewModel.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          build-root-directory: JarvisAssistant
      - run: gradle assembleDebug --no-daemon
        working-directory: JarvisAssistant
      - uses: actions/upload-artifact@v4
        with:
          name: MJ-debug-apk
          path: JarvisAssistant/app/build/outputs/apk/debug/app-debug.apk
